<!-- @dsCard group="Layout" height=200 subtitle="Title left, toolbar right, content below" -->
<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); }
  .page { display: flex; flex-direction: column; gap: 24px; max-width: 100%; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; color: var(--ink); }
  .toolbar { display: flex; gap: 8px; }
  .btn { font-family: var(--font-sans); font-size: 14px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; border-radius: var(--radius-md); height: 40px; padding: 0 16px; border: 0; }
  .primary { background: var(--brand); color: var(--on-fill); }
  .quiet { background: transparent; color: var(--ink-muted); }
  .content { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-lg); height: 90px; }
</style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>Facturas</h1>
      <div class="toolbar">
        <button class="btn quiet">Filtrar</button>
        <button class="btn primary">Nueva factura</button>
      </div>
    </div>
    <div class="content"></div>
  </div>
</body>
</html>
