<!-- @dsCard group="Overlays" height=280 subtitle="Create, opened over the Stock list" -->
<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .backdrop { position: relative; height: 280px; background: var(--scrim); display: flex; align-items: center; justify-content: center; }
  .dialog { width: 400px; background: var(--surface-raised); border-radius: var(--radius-lg); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  h2 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; color: var(--ink); }
  .close { border: 0; background: none; color: var(--ink-muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--ink-muted); }
  input { height: 40px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface-page); padding: 0 12px; box-sizing: border-box; font-family: var(--font-sans); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; border-radius: var(--radius-md); height: 40px; padding: 0 16px; border: 0; }
  .primary { background: var(--brand); color: var(--on-fill); }
  .secondary { background: transparent; color: var(--accent-strong); border: 1px solid var(--accent); }
  .quiet { background: transparent; color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="backdrop">
    <div class="dialog">
      <div class="head"><h2>Nuevo producto</h2><button class="close">&times;</button></div>
      <div class="grid">
        <div class="field"><label>Nombre</label><input value="Cemento Portland 25kg"></div>
        <div class="field"><label>Precio (Gs)</label><input value="52.000"></div>
      </div>
      <div class="actions">
        <button class="btn quiet">Cancelar</button>
        <button class="btn secondary">Guardar y nuevo</button>
        <button class="btn primary">Guardar</button>
      </div>
    </div>
  </div>
</body>
</html>
