<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  .brand { fill: var(--brand); }
  .accent { fill: var(--accent); }
  .ink { fill: var(--ink); }
  .relief { fill: var(--border-strong); }
  .ground { fill: var(--surface-page); }
  .name { font-family: var(--font-sans); font-weight: 700; font-size: 120px; fill: var(--ink); }
  .tagline { font-family: var(--font-sans); font-weight: 400; font-size: 14px; fill: var(--ink-muted); }
</style>
</head>
<body>
<svg viewBox="0 0 960 300" width="960" height="300" xmlns="http://www.w3.org/2000/svg">
  <!--
    blocks: brand (radius-lg slab, space-7-derived width), accent + ink (two radius-lg
    bands stacked with space-4 gap), border-strong (small radius-md square bleeding off
    the right edge at the accent/ink seam) - four blocks, a quarter of the cover.
    arrangement: one tall slab left of the zone with two stacked bands to its right -
    a shelf, the thing a corral (kora) actually is: one big holding space plus rows of bins.
    pattern: a tile grid cut into the slab in the ground color, a few tiles merged
    two-wide - the stock table's own rows, at radius-sm, inside the one block shaped
    like a storage bay.
    scales used: radius-md (8) on every block/tile, radius-sm (4) on tile corners,
    space-4 (16) as the gap between blocks, a 26px pitch (tile 18 + gap) for the grid.
  -->
  <rect class="ground" x="0" y="0" width="960" height="300"/>
  <rect class="brand" x="496" y="24" width="150" height="252" rx="8"/>
  <rect class="accent" x="662" y="24" width="266" height="118" rx="8"/>
  <rect class="ink" x="662" y="158" width="266" height="118" rx="8"/>
  <rect class="relief" x="888" y="136" width="88" height="88" rx="8"/>
  <g>
      <rect class="ground" x="516" y="44" width="18" height="18" rx="4"/>
      <rect class="ground" x="542" y="44" width="18" height="18" rx="4"/>
      <rect class="ground" x="568" y="44" width="18" height="18" rx="4"/>
      <rect class="ground" x="594" y="44" width="18" height="18" rx="4"/>
      <rect class="ground" x="516" y="70" width="44" height="18" rx="4"/>
      <rect class="ground" x="568" y="70" width="18" height="18" rx="4"/>
      <rect class="ground" x="594" y="70" width="18" height="18" rx="4"/>
      <rect class="ground" x="516" y="96" width="18" height="18" rx="4"/>
      <rect class="ground" x="542" y="96" width="18" height="18" rx="4"/>
      <rect class="ground" x="568" y="96" width="18" height="18" rx="4"/>
      <rect class="ground" x="594" y="96" width="18" height="18" rx="4"/>
      <rect class="ground" x="516" y="122" width="18" height="18" rx="4"/>
      <rect class="ground" x="542" y="122" width="18" height="18" rx="4"/>
      <rect class="ground" x="568" y="122" width="44" height="18" rx="4"/>
      <rect class="ground" x="516" y="148" width="18" height="18" rx="4"/>
      <rect class="ground" x="542" y="148" width="18" height="18" rx="4"/>
      <rect class="ground" x="568" y="148" width="18" height="18" rx="4"/>
      <rect class="ground" x="594" y="148" width="18" height="18" rx="4"/>
      <rect class="ground" x="516" y="174" width="18" height="18" rx="4"/>
      <rect class="ground" x="542" y="174" width="18" height="18" rx="4"/>
      <rect class="ground" x="568" y="174" width="18" height="18" rx="4"/>
      <rect class="ground" x="594" y="174" width="18" height="18" rx="4"/>
      <rect class="ground" x="516" y="200" width="18" height="18" rx="4"/>
      <rect class="ground" x="542" y="200" width="44" height="18" rx="4"/>
      <rect class="ground" x="594" y="200" width="18" height="18" rx="4"/>
      <rect class="ground" x="516" y="226" width="18" height="18" rx="4"/>
      <rect class="ground" x="542" y="226" width="18" height="18" rx="4"/>
      <rect class="ground" x="568" y="226" width="18" height="18" rx="4"/>
      <rect class="ground" x="594" y="226" width="18" height="18" rx="4"/>
  </g>
  <text class="name" x="48" y="222">Kora</text>
  <text class="tagline" x="48" y="256">El sistema de diseño de StockManagement</text>
</svg>
</body>
</html>
