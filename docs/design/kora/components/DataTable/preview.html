<!-- @dsCard group="Data" height=220 subtitle="Below-minimum row flagged" -->
<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); }
  table { width: 100%; border-collapse: collapse; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  th { text-align: left; font-size: 15px; font-weight: 600; color: var(--ink-muted); background: var(--surface-sunken); padding: 12px 16px; }
  td { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--ink); font-size: 15px; }
  tr:hover td { background: var(--surface-sunken); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .flag td:first-child { box-shadow: inset 3px 0 var(--danger); }
  .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); padding: 3px 8px; font-size: 13px; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .danger { background: var(--danger-subtle); color: var(--danger); }
  .danger .dot { background: var(--danger); }
  .success { background: var(--success-subtle); color: var(--success); }
  .success .dot { background: var(--success); }
  .actions { text-align: right; }
  .actions span { color: var(--ink-muted); font-size: 13px; margin-left: 12px; }
</style>
</head>
<body>
  <table>
    <thead><tr><th>Producto</th><th class="num">Stock</th><th>Estado</th><th class="actions"></th></tr></thead>
    <tbody>
      <tr class="flag">
        <td>Cemento Portland 25kg</td>
        <td class="num">3</td>
        <td><span class="badge danger"><span class="dot"></span>Agotado</span></td>
        <td class="actions"><span>Editar</span><span>Duplicar</span></td>
      </tr>
      <tr>
        <td>Clavo 2" (caja)</td>
        <td class="num">140</td>
        <td><span class="badge success"><span class="dot"></span>En stock</span></td>
        <td class="actions"><span>Editar</span><span>Duplicar</span></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
