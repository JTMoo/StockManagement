name: Claude Code Review

# Blocking review findings gate auto-merge alongside required CI (see docs/adr/0027, CLAUDE.md merge rule).
# Needs a CLAUDE_CODE_OAUTH_TOKEN repo secret (generate with `claude setup-token`, Pro/Max subscription — no API key needed).
# Skips cleanly (not a failing required check) until that secret is added.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Run Claude Code Review
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        prompt: /code-review
