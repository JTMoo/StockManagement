name: Sync main into open PRs

# No merge queue on a personal-account repo (ADR-0027): merge main into every open PR branch
# after each push to main instead, so conflicts get resolved one PR at a time.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Debounce: a push mid-sync shouldn't pile up overlapping merge attempts.
concurrency:
  group: sync-main-into-prs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Merge main into each open PR branch
      env:
        # A push authenticated as the default GITHUB_TOKEN (github-actions[bot]) makes GitHub
        # hold the resulting pull_request checks as action_required/0 jobs pending manual
        # approval, even on a same-repo branch - see ADR-0027. SYNC_PR_TOKEN (a PAT with repo
        # write, owner-provided) attributes the push to a real collaborator instead, so checks
        # run normally, same as any human or App push. Falls back to GITHUB_TOKEN (reproduces
        # the stuck-check symptom) until the secret is added.
        GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        gh pr list --state open --base main --limit 100 --json number,headRefName | jq -c '.[]' | while read -r row; do
          number=$(echo "$row" | jq -r .number)
          branch=$(echo "$row" | jq -r .headRefName)

          git fetch origin "$branch" main
          git checkout -B "$branch" "origin/$branch"

          # Already contains main (e.g. a human/App push already synced it) - nothing to do.
          if git merge-base --is-ancestor origin/main HEAD; then
            continue
          fi

          if git merge --no-edit origin/main; then
            git push origin "$branch"
          else
            git merge --abort
            gh pr comment "$number" --body "Merge conflict with \`main\` after the latest push — needs a manual merge before this PR can go green."
          fi
        done
